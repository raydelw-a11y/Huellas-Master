<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes talkBounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-7px) scale(1.04); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 0.35; }
      100% { transform: scale(0.92); opacity: 0.85; }
    }
    @keyframes packetFlow {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eqBar1 {
      0%, 100% { height: 3px; }
      50% { height: 10px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 9px; }
      50% { height: 3px; }
    }
    .robot-idle {
      animation: floatSlow 3.2s ease-in-out infinite;
    }
    .robot-speaking {
      animation: talkBounce 0.65s ease-in-out infinite;
    }
    .beam-active {
      stroke-dasharray: 6 6;
      animation: packetFlow 0.7s linear infinite;
    }
    .halo-spin {
      transform-origin: center;
      animation: spinSlow 8s linear infinite;
    }
    .core-pulse {
      transform-origin: center;
      animation: pulseRing 2s ease-in-out infinite;
    }
    .eq-1 { animation: eqBar1 0.32s ease-in-out infinite; }
    .eq-2 { animation: eqBar2 0.28s ease-in-out infinite; }
    .eq-3 { animation: eqBar1 0.38s ease-in-out infinite; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2 select-none">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-4 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
        <span id="modeTitle" class="font-semibold text-sm text-[var(--foreground)]">🤝 MODO TRIO EN VIVO — Sala de Debate Robótico</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btnDuo" onclick="setMode('duo')" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">
          MODO DUO
        </button>
        <button id="btnTrio" onclick="setMode('trio')" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] transition">
          MODO TRIO
        </button>
        <button onclick="nextTurn()" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--foreground)] hover:opacity-80 transition">
          ⏭️ Turno
        </button>
      </div>
    </div>

    <div class="mt-3 bg-[var(--background)] border border-[var(--border)] rounded-xl p-3 flex items-start gap-3">
      <div id="speakerBadge" class="px-2.5 py-1 rounded-lg text-xs font-bold shrink-0 bg-cyan-500/20 text-cyan-400 border border-cyan-500/40">
        🌐 Gemini Web (Argon High)
      </div>
      <div class="flex-1 min-w-0">
        <p id="speechText" class="text-xs text-[var(--foreground)] leading-relaxed font-medium"></p>
      </div>
      <span id="turnCounter" class="text-xs text-[var(--muted-foreground)] shrink-0 font-mono">Ronda 1/4</span>
    </div>

    <div class="relative mt-3 bg-[var(--background)] border border-[var(--border)] rounded-xl p-3 overflow-hidden">
      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 600 170" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gradBeam" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
        </defs>
        <line x1="85" y1="88" x2="515" y2="88" stroke="currentColor" class="text-[var(--border)]" stroke-width="1.5" stroke-dasharray="3 3" />
        <ellipse cx="300" cy="138" rx="210" ry="18" fill="none" stroke="url(#gradBeam)" stroke-width="1.5" opacity="0.35" />
        <path id="activeBeamPath" d="M 85 78 Q 190 22 228 78" fill="none" stroke="url(#gradBeam)" stroke-width="3" class="beam-active" />
      </svg>

      <div id="robotsGrid" class="relative z-10 grid grid-cols-4 gap-2 items-center">
        <div id="robotCard0" onclick="selectSpeaker(0)" class="cursor-pointer flex flex-col items-center p-2 rounded-xl border border-transparent transition">
          <div id="robotWrap0" class="robot-speaking relative">
            <svg width="74" height="82" viewBox="0 0 80 90">
              <line x1="40" y1="6" x2="40" y2="18" stroke="#22d3ee" stroke-width="3" />
              <circle cx="40" cy="5" r="4" fill="#22d3ee" class="core-pulse" />
              <rect x="16" y="18" width="48" height="34" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5" />
              <rect x="22" y="24" width="36" height="14" rx="5" fill="#164e63" />
              <circle cx="31" cy="31" r="3.5" fill="#67e8f9" />
              <circle cx="49" cy="31" r="3.5" fill="#67e8f9" />
              <g id="mouth0" transform="translate(31, 41)"></g>
              <rect x="22" y="55" width="36" height="24" rx="7" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
              <circle cx="40" cy="67" r="6" fill="#06b6d4" class="core-pulse" />
              <ellipse cx="40" cy="67" rx="6" ry="2.5" fill="none" stroke="#cffafe" stroke-width="1" />
            </svg>
          </div>
          <span class="text-xs font-bold text-cyan-400 mt-1 text-center">Gemini Web</span>
          <span id="status0" class="text-xs text-[var(--muted-foreground)] text-center">🎙️ Hablando</span>
        </div>

        <div id="robotCard1" onclick="selectSpeaker(1)" class="cursor-pointer flex flex-col items-center p-2 rounded-xl border border-transparent transition">
          <div id="robotWrap1" class="robot-idle relative">
            <svg width="74" height="82" viewBox="0 0 80 90">
              <polygon points="28,18 34,9 40,15 46,9 52,18" fill="#c084fc" />
              <rect x="16" y="18" width="48" height="34" rx="11" fill="#1e1b4b" stroke="#c084fc" stroke-width="2.5" />
              <rect x="22" y="24" width="36" height="14" rx="5" fill="#3b0764" />
              <circle cx="31" cy="31" r="3.5" fill="#e9d5ff" />
              <circle cx="49" cy="31" r="3.5" fill="#e9d5ff" />
              <g id="mouth1" transform="translate(31, 41)"></g>
              <rect x="22" y="55" width="36" height="24" rx="7" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" />
              <polygon points="40,60 46,67 40,74 34,67" fill="#a855f7" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-purple-400 mt-1 text-center">Claude Opus</span>
          <span id="status1" class="text-xs text-[var(--muted-foreground)] text-center">🧠 Escuchando</span>
        </div>

        <div id="robotCard2" onclick="selectSpeaker(2)" class="cursor-pointer flex flex-col items-center p-2 rounded-xl border border-transparent transition">
          <div id="robotWrap2" class="robot-idle relative">
            <svg width="74" height="82" viewBox="0 0 80 90">
              <circle cx="40" cy="11" r="6" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" class="halo-spin" />
              <rect x="16" y="18" width="48" height="34" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2.5" />
              <rect x="22" y="24" width="36" height="14" rx="5" fill="#022c22" />
              <circle cx="31" cy="31" r="3.5" fill="#6ee7b7" />
              <circle cx="49" cy="31" r="3.5" fill="#6ee7b7" />
              <g id="mouth2" transform="translate(31, 41)"></g>
              <rect x="22" y="55" width="36" height="24" rx="7" fill="#064e3b" stroke="#34d399" stroke-width="2" />
              <circle cx="40" cy="67" r="6" fill="#10b981" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-emerald-400 mt-1 text-center">Gemini Argon</span>
          <span id="status2" class="text-xs text-[var(--muted-foreground)] text-center">🔬 Razonando</span>
        </div>

        <div id="robotCard3" onclick="selectSpeaker(3)" class="cursor-pointer flex flex-col items-center p-2 rounded-xl border border-transparent transition">
          <div id="robotWrap3" class="robot-idle relative">
            <svg width="74" height="82" viewBox="0 0 80 90">
              <polygon points="42,4 34,14 40,14 37,20 47,11 41,11" fill="#fbbf24" />
              <rect x="16" y="18" width="48" height="34" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="2.5" />
              <rect x="22" y="24" width="36" height="14" rx="5" fill="#270e02" />
              <circle cx="31" cy="31" r="3.5" fill="#fde68a" />
              <circle cx="49" cy="31" r="3.5" fill="#fde68a" />
              <g id="mouth3" transform="translate(31, 41)"></g>
              <rect x="22" y="55" width="36" height="24" rx="7" fill="#451a03" stroke="#fbbf24" stroke-width="2" />
              <polygon points="42,60 35,68 40,68 38,74 45,66 40,66" fill="#f59e0b" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-amber-400 mt-1 text-center">Gemini Flash</span>
          <span id="status3" class="text-xs text-[var(--muted-foreground)] text-center">⚡ Auditando</span>
        </div>
      </div>
    </div>

    <div class="mt-3 flex items-center justify-between gap-3 text-xs text-[var(--muted-foreground)]">
      <span>🛡️ Regla activa: <strong>Nadie se detiene hasta que todos terminen</strong></span>
      <span id="consensusLabel" class="font-medium text-emerald-400">⚡ Sincronizando perspectivas</span>
    </div>
  </div>

  <script>
    const dialogueTurns = [
      {
        speaker: 0,
        target: 1,
        badge: '🌐 Gemini Web (Argon High)',
        badgeClass: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40',
        text: '"Aportando perspectiva externa desde una ventana limpia fuera de los Notebooks con Argon en High."',
        statuses: ['🎙️ Hablando', '👀 Escuchando', '🧠 Analizando', '⚡ Verificando']
      },
      {
        speaker: 1,
        target: 2,
        badge: '🟣 Claude Opus (Arquitecto)',
        badgeClass: 'bg-purple-500/20 text-purple-300 border-purple-500/40',
        text: '"Estructurando la arquitectura principal y contrastando con la propuesta de Gemini Web y Argon."',
        statuses: ['✅ Listo', '🎙️ Rebatiendo', '👀 Evaluando', '⚡ Auditando']
      },
      {
        speaker: 2,
        target: 3,
        badge: '💎 Gemini Argon (Contraparte Pro)',
        badgeClass: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        text: '"Analizando el flujo profundo sin límites de tiempo ni cortes hasta completar el diagnóstico."',
        statuses: ['✅ Listo', '🤝 Evaluando', '🎙️ Argumentando', '👀 Escuchando']
      },
      {
        speaker: 3,
        target: 1,
        badge: '⚡ Gemini Flash (Auditor Crítico)',
        badgeClass: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        text: '"Auditando casos borde, líneas exactas y sincronización para cerrar el consenso unánime."',
        statuses: ['✅ Consenso', '✅ Consenso', '✅ Consenso', '🎙️ Veredicto']
      }
    ];

    const xCoords = [85, 228, 372, 515];
    let currentTurnIndex = 0;
    let currentMode = 'trio';
    const mouthColors = ['#22d3ee', '#c084fc', '#34d399', '#fbbf24'];

    function renderEqualizerHTML(color) {
      return `
        <rect x="0" y="0" width="3" height="6" rx="1" fill="${color}" class="eq-1" />
        <rect x="5" y="0" width="3" height="8" rx="1" fill="${color}" class="eq-2" />
        <rect x="10" y="0" width="3" height="5" rx="1" fill="${color}" class="eq-3" />
        <rect x="15" y="0" width="3" height="7" rx="1" fill="${color}" class="eq-1" />
      `;
    }

    function renderIdleMouthHTML(color) {
      return `<rect x="0" y="2" width="18" height="3" rx="1.5" fill="${color}" />`;
    }

    function updateScene() {
      const turn = dialogueTurns[currentTurnIndex];
      const badgeEl = document.getElementById('speakerBadge');
      badgeEl.className = `px-2.5 py-1 rounded-lg text-xs font-bold shrink-0 border ${turn.badgeClass}`;
      badgeEl.textContent = turn.badge;
      document.getElementById('speechText').textContent = turn.text;
      document.getElementById('turnCounter').textContent = `Ronda ${currentTurnIndex + 1}/${currentMode === 'trio' ? 4 : 3}`;

      for (let i = 0; i < 4; i++) {
        const wrap = document.getElementById(`robotWrap${i}`);
        const card = document.getElementById(`robotCard${i}`);
        const mouth = document.getElementById(`mouth${i}`);
        const status = document.getElementById(`status${i}`);

        if (i === turn.speaker) {
          wrap.className = 'robot-speaking relative';
          card.className = 'cursor-pointer flex flex-col items-center p-2 rounded-xl border border-[var(--border)] bg-[var(--card)] shadow-sm transition';
          mouth.style.opacity = '1';
          mouth.innerHTML = renderEqualizerHTML(mouthColors[i]);
        } else {
          wrap.className = 'robot-idle relative';
          card.className = 'cursor-pointer flex flex-col items-center p-2 rounded-xl border border-transparent opacity-85 hover:opacity-100 transition';
          mouth.style.opacity = '0.4';
          mouth.innerHTML = renderIdleMouthHTML(mouthColors[i]);
        }
        status.textContent = turn.statuses[i];
      }

      const x1 = xCoords[turn.speaker];
      const x2 = xCoords[turn.target];
      const midX = (x1 + x2) / 2;
      document.getElementById('activeBeamPath').setAttribute('d', `M ${x1} 78 Q ${midX} 22 ${x2} 78`);
    }

    function nextTurn() {
      const maxTurns = currentMode === 'trio' ? 4 : 3;
      currentTurnIndex = (currentTurnIndex + 1) % maxTurns;
      updateScene();
    }

    function selectSpeaker(idx) {
      currentTurnIndex = idx;
      updateScene();
    }

    function setMode(mode) {
      currentMode = mode;
      const card3 = document.getElementById('robotCard3');
      const grid = document.getElementById('robotsGrid');
      const btnDuo = document.getElementById('btnDuo');
      const btnTrio = document.getElementById('btnTrio');
      const title = document.getElementById('modeTitle');

      if (mode === 'duo') {
        card3.style.display = 'none';
        grid.className = 'relative z-10 grid grid-cols-3 gap-2 items-center';
        title.textContent = '🤝 MODO DUO EN VIVO — Sala de Debate Robótico';
        btnDuo.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] transition';
        btnTrio.className = 'px-2.5 py-1 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition';
        if (currentTurnIndex >= 3) currentTurnIndex = 0;
      } else {
        card3.style.display = 'flex';
        grid.className = 'relative z-10 grid grid-cols-4 gap-2 items-center';
        title.textContent = '🤝 MODO TRIO EN VIVO — Sala de Debate Robótico';
        btnTrio.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] transition';
        btnDuo.className = 'px-2.5 py-1 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition';
      }
      updateScene();
    }

    setInterval(nextTurn, 3200);
    updateScene();
  </script>
</body>
</html>
