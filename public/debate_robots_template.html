<!DOCTYPE html>
<html lang="es" class="overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes talkBounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.05); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 0.35; }
    }
    @keyframes packetFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eqBar1 {
      0%, 100% { height: 3px; }
      50% { height: 9px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 8px; }
      50% { height: 3px; }
    }
    .robot-idle { animation: floatSlow 3s ease-in-out infinite; }
    .robot-speaking { animation: talkBounce 0.6s ease-in-out infinite; }
    .beam-active { stroke-dasharray: 5 5; animation: packetFlow 0.65s linear infinite; }
    .halo-spin { transform-origin: center; animation: spinSlow 7s linear infinite; }
    .core-pulse { transform-origin: center; animation: pulseRing 2s ease-in-out infinite; }
    .eq-1 { animation: eqBar1 0.32s ease-in-out infinite; }
    .eq-2 { animation: eqBar2 0.28s ease-in-out infinite; }
    .eq-3 { animation: eqBar1 0.38s ease-in-out infinite; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-1 select-none overflow-hidden">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-2.5 shadow-sm overflow-hidden">
    <div class="flex items-center justify-between gap-2 pb-1.5 border-b border-[var(--border)]">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="inline-flex w-2 h-2 rounded-full bg-emerald-500 animate-ping shrink-0"></span>
        <span id="modeTitle" class="font-semibold text-xs text-[var(--foreground)] truncate">🤝 MODO TRIO — Debate en Vivo</span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="btnDuo" onclick="setMode('duo')" class="px-2 py-0.5 rounded-md text-xs font-medium border border-[var(--border)] text-[var(--muted-foreground)] transition">
          DUO
        </button>
        <button id="btnTrio" onclick="setMode('trio')" class="px-2 py-0.5 rounded-md text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] transition">
          TRIO
        </button>
        <button onclick="nextTurn()" class="px-2 py-0.5 rounded-md text-xs font-medium border border-[var(--border)] text-[var(--foreground)] hover:opacity-80 transition">
          ⏭️
        </button>
      </div>
    </div>

    <div class="mt-1.5 bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 flex items-center gap-2 h-11 overflow-hidden">
      <span id="speakerBadge" class="px-2 py-0.5 rounded text-xs font-bold shrink-0 bg-cyan-500/20 text-cyan-400 border border-cyan-500/40">
        🌐 Web Carbon
      </span>
      <p id="speechText" class="text-xs text-[var(--foreground)] leading-snug line-clamp-2 flex-1 min-w-0"></p>
    </div>

    <div class="relative mt-1.5 bg-[var(--background)] border border-[var(--border)] rounded-lg px-2 py-1.5 overflow-hidden">
      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 600 115" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gradBeam" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
        </defs>
        <line x1="75" y1="54" x2="525" y2="54" stroke="currentColor" class="text-[var(--border)]" stroke-width="1.2" stroke-dasharray="3 3" />
        <path id="activeBeamPath" d="M 75 50 Q 150 12 225 50" fill="none" stroke="url(#gradBeam)" stroke-width="2.5" class="beam-active" />
      </svg>

      <div id="robotsGrid" class="relative z-10 grid grid-cols-4 gap-1 items-center">
        <div id="robotCard0" onclick="selectSpeaker(0)" class="cursor-pointer flex flex-col items-center py-1 px-1 rounded-lg border border-transparent transition">
          <div id="robotWrap0" class="robot-speaking">
            <svg width="48" height="52" viewBox="0 0 80 86">
              <line x1="40" y1="5" x2="40" y2="16" stroke="#22d3ee" stroke-width="3" />
              <circle cx="40" cy="4" r="4" fill="#22d3ee" class="core-pulse" />
              <rect x="16" y="16" width="48" height="34" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5" />
              <rect x="22" y="22" width="36" height="14" rx="5" fill="#164e63" />
              <circle cx="31" cy="29" r="3.5" fill="#67e8f9" />
              <circle cx="49" cy="29" r="3.5" fill="#67e8f9" />
              <g id="mouth0" transform="translate(31, 39)"></g>
              <rect x="22" y="53" width="36" height="22" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
              <circle cx="40" cy="64" r="5.5" fill="#06b6d4" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-cyan-400 leading-tight truncate max-w-full">Web Carbon</span>
          <span id="status0" class="text-xs text-[var(--muted-foreground)] leading-tight truncate max-w-full">🎙️ Habla</span>
        </div>

        <div id="robotCard1" onclick="selectSpeaker(1)" class="cursor-pointer flex flex-col items-center py-1 px-1 rounded-lg border border-transparent transition">
          <div id="robotWrap1" class="robot-idle">
            <svg width="48" height="52" viewBox="0 0 80 86">
              <polygon points="28,16 34,7 40,13 46,7 52,16" fill="#c084fc" />
              <rect x="16" y="16" width="48" height="34" rx="11" fill="#1e1b4b" stroke="#c084fc" stroke-width="2.5" />
              <rect x="22" y="22" width="36" height="14" rx="5" fill="#3b0764" />
              <circle cx="31" cy="29" r="3.5" fill="#e9d5ff" />
              <circle cx="49" cy="29" r="3.5" fill="#e9d5ff" />
              <g id="mouth1" transform="translate(31, 39)"></g>
              <rect x="22" y="53" width="36" height="22" rx="6" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" />
              <polygon points="40,58 46,64 40,70 34,64" fill="#a855f7" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-purple-400 leading-tight truncate max-w-full">Carbon High</span>
          <span id="status1" class="text-xs text-[var(--muted-foreground)] leading-tight truncate max-w-full">🧠 Oye</span>
        </div>

        <div id="robotCard2" onclick="selectSpeaker(2)" class="cursor-pointer flex flex-col items-center py-1 px-1 rounded-lg border border-transparent transition">
          <div id="robotWrap2" class="robot-idle">
            <svg width="48" height="52" viewBox="0 0 80 86">
              <circle cx="40" cy="9" r="5.5" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" class="halo-spin" />
              <rect x="16" y="16" width="48" height="34" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2.5" />
              <rect x="22" y="22" width="36" height="14" rx="5" fill="#022c22" />
              <circle cx="31" cy="29" r="3.5" fill="#6ee7b7" />
              <circle cx="49" cy="29" r="3.5" fill="#6ee7b7" />
              <g id="mouth2" transform="translate(31, 39)"></g>
              <rect x="22" y="53" width="36" height="22" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2" />
              <circle cx="40" cy="64" r="5.5" fill="#10b981" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-emerald-400 leading-tight truncate max-w-full">Argon High</span>
          <span id="status2" class="text-xs text-[var(--muted-foreground)] leading-tight truncate max-w-full">🔬 Piensa</span>
        </div>

        <div id="robotCard3" onclick="selectSpeaker(3)" class="cursor-pointer flex flex-col items-center py-1 px-1 rounded-lg border border-transparent transition">
          <div id="robotWrap3" class="robot-idle">
            <svg width="48" height="52" viewBox="0 0 80 86">
              <polygon points="42,3 34,12 40,12 37,18 47,9 41,9" fill="#fbbf24" />
              <rect x="16" y="16" width="48" height="34" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="2.5" />
              <rect x="22" y="22" width="36" height="14" rx="5" fill="#270e02" />
              <circle cx="31" cy="29" r="3.5" fill="#fde68a" />
              <circle cx="49" cy="29" r="3.5" fill="#fde68a" />
              <g id="mouth3" transform="translate(31, 39)"></g>
              <rect x="22" y="53" width="36" height="22" rx="6" fill="#451a03" stroke="#fbbf24" stroke-width="2" />
              <polygon points="42,58 35,65 40,65 38,71 45,63 40,63" fill="#f59e0b" class="core-pulse" />
            </svg>
          </div>
          <span class="text-xs font-bold text-amber-400 leading-tight truncate max-w-full">3.8 Flash</span>
          <span id="status3" class="text-xs text-[var(--muted-foreground)] leading-tight truncate max-w-full">⚡ Audita</span>
        </div>
      </div>
    </div>

    <div class="mt-1.5 flex items-center justify-between gap-2 text-xs text-[var(--muted-foreground)]">
      <span class="truncate">🛡️ <strong>Nadie se detiene hasta que todos terminen</strong></span>
      <span id="turnCounter" class="font-mono text-emerald-400 shrink-0">Ronda 1/4</span>
    </div>
  </div>

  <script>
    const dialogueTurns = [
      {
        speaker: 0,
        target: 1,
        badge: '🌐 Web Carbon',
        badgeClass: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40',
        text: '"Perspectiva externa lista desde ventana limpia fuera de Notebooks con 4 Carbon en High."',
        statuses: ['🎙️ Habla', '👀 Oye', '🧠 Analiza', '⚡ Audita']
      },
      {
        speaker: 1,
        target: 2,
        badge: '🟣 Carbon High',
        badgeClass: 'bg-purple-500/20 text-purple-300 border-purple-500/40',
        text: '"Estructuro la arquitectura principal y contrasto la solución con Web Carbon y Argon High."',
        statuses: ['✅ Listo', '🎙️ Rebate', '👀 Evalúa', '⚡ Audita']
      },
      {
        speaker: 2,
        target: 3,
        badge: '💎 Argon High',
        badgeClass: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        text: '"Analizando a fondo sin interrupciones y debatiendo las propuestas en Ronda 2."',
        statuses: ['✅ Listo', '🤝 Evalúa', '🎙️ Habla', '👀 Oye']
      },
      {
        speaker: 3,
        target: 1,
        badge: '⚡ 3.8 Flash',
        badgeClass: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        text: '"¡Casos borde y líneas verificadas! Tras el debate cruzado llegamos a consenso unánime."',
        statuses: ['✅ Consenso', '✅ Consenso', '✅ Consenso', '🎙️ Veredicto']
      }
    ];

    const xCoordsTrio = [75, 225, 375, 525];
    const xCoordsDuo = [100, 300, 500, 300];
    let currentTurnIndex = 0;
    let currentMode = 'trio';
    const mouthColors = ['#22d3ee', '#c084fc', '#34d399', '#fbbf24'];

    function renderEqualizerHTML(color) {
      return `
        <rect x="0" y="0" width="3" height="6" rx="1" fill="${color}" class="eq-1" />
        <rect x="5" y="0" width="3" height="8" rx="1" fill="${color}" class="eq-2" />
        <rect x="10" y="0" width="3" height="5" rx="1" fill="${color}" class="eq-3" />
        <rect x="15" y="0" width="3" height="7" rx="1" fill="${color}" class="eq-1" />
      `;
    }

    function renderIdleMouthHTML(color) {
      return `<rect x="0" y="2" width="18" height="3" rx="1.5" fill="${color}" />`;
    }

    function updateScene() {
      const turn = dialogueTurns[currentTurnIndex];
      const badgeEl = document.getElementById('speakerBadge');
      badgeEl.className = `px-2 py-0.5 rounded text-xs font-bold shrink-0 border ${turn.badgeClass}`;
      badgeEl.textContent = turn.badge;
      document.getElementById('speechText').textContent = turn.text;
      document.getElementById('turnCounter').textContent = `Ronda ${currentTurnIndex + 1}/${currentMode === 'trio' ? 4 : 3}`;

      for (let i = 0; i < 4; i++) {
        const wrap = document.getElementById(`robotWrap${i}`);
        const card = document.getElementById(`robotCard${i}`);
        const mouth = document.getElementById(`mouth${i}`);
        const status = document.getElementById(`status${i}`);

        if (i === turn.speaker) {
          wrap.className = 'robot-speaking';
          card.className = 'cursor-pointer flex flex-col items-center py-1 px-1 rounded-lg border border-[var(--border)] bg-[var(--card)] shadow-sm transition';
          mouth.style.opacity = '1';
          mouth.innerHTML = renderEqualizerHTML(mouthColors[i]);
        } else {
          wrap.className = 'robot-idle';
          card.className = 'cursor-pointer flex flex-col items-center py-1 px-1 rounded-lg border border-transparent opacity-85 hover:opacity-100 transition';
          mouth.style.opacity = '0.4';
          mouth.innerHTML = renderIdleMouthHTML(mouthColors[i]);
        }
        status.textContent = turn.statuses[i];
      }

      const coords = currentMode === 'trio' ? xCoordsTrio : xCoordsDuo;
      const x1 = coords[turn.speaker];
      const x2 = coords[turn.target];
      const midX = (x1 + x2) / 2;
      document.getElementById('activeBeamPath').setAttribute('d', `M ${x1} 48 Q ${midX} 10 ${x2} 48`);
    }

    function nextTurn() {
      const maxTurns = currentMode === 'trio' ? 4 : 3;
      currentTurnIndex = (currentTurnIndex + 1) % maxTurns;
      updateScene();
    }

    function selectSpeaker(idx) {
      currentTurnIndex = idx;
      updateScene();
    }

    function setMode(mode) {
      currentMode = mode;
      const card3 = document.getElementById('robotCard3');
      const grid = document.getElementById('robotsGrid');
      const btnDuo = document.getElementById('btnDuo');
      const btnTrio = document.getElementById('btnTrio');
      const title = document.getElementById('modeTitle');

      if (mode === 'duo') {
        card3.style.display = 'none';
        grid.className = 'relative z-10 grid grid-cols-3 gap-1 items-center';
        title.textContent = '🤝 MODO DUO — Debate en Vivo';
        btnDuo.className = 'px-2 py-0.5 rounded-md text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] transition';
        btnTrio.className = 'px-2 py-0.5 rounded-md text-xs font-medium border border-[var(--border)] text-[var(--muted-foreground)] transition';
        if (currentTurnIndex >= 3) currentTurnIndex = 0;
      } else {
        card3.style.display = 'flex';
        grid.className = 'relative z-10 grid grid-cols-4 gap-1 items-center';
        title.textContent = '🤝 MODO TRIO — Debate en Vivo';
        btnTrio.className = 'px-2 py-0.5 rounded-md text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] transition';
        btnDuo.className = 'px-2 py-0.5 rounded-md text-xs font-medium border border-[var(--border)] text-[var(--muted-foreground)] transition';
      }
      updateScene();
    }

    setInterval(nextTurn, 3200);
    updateScene();
  </script>
</body>
</html>
