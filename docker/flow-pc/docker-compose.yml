services:
  flow-pc:
    build:
      context: .
      dockerfile: Dockerfile
    image: huellas-flow-pc:latest
    container_name: huellas-flow-pc
    hostname: flow-pc
    platform: linux/amd64
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
    ports:
      - "127.0.0.1:3090:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - LC_ALL=en_US.UTF-8
      - CUSTOM_PORT=3000
      - NO_SSL=true
      - TITLE=Flow PC (Agent)
    volumes:
      - flow_chrome_profile:/config
      - "${HUELLAS_VIDEOS_ROOT:-/Users/raydelsantana/Library/Mobile Documents/com~apple~CloudDocs/0YouTube/Huellas de la Humanidad/Videos}:/mnt/huellas_videos:ro"
      - "${HUELLAS_FLOW_STAGING_DIR:-/Users/raydelsantana/Library/Caches/huellas-flow-staging}:/downloads:rw"
    restart: "no"

volumes:
  flow_chrome_profile:
    name: huellas_flow_chrome_profile
